<div class="login-container"></div>
<mat-card appearance="outlined" class="login-card">
  <mat-card-header>
    <mat-card-title>Enter your email and password to login</mat-card-title>
  </mat-card-header>
  <mat-card-content class="login-card-content">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" class="input-field" />
        @if (loginForm.get('email')?.hasError('required')) {
          <mat-error>Email is required</mat-error>
        }
        @if (loginForm.get('email')?.hasError('email')) {
          <mat-error>Email is invalid</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input
          matInput
          formControlName="password"
          type="password"
          class="input-field"
        />
        @if (loginForm.get('password')?.hasError('required')) {
          <mat-error>Password is required</mat-error>
        }
      </mat-form-field>
      <button
        mat-raised-button
        [disabled]="loginForm.invalid"
        color="primary"
        type="submit"
      >
        Login
      </button>
    </form>
  </mat-card-content>
</mat-card>
